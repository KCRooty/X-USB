# Compila la APK en cada push y, al crear una etiqueta vX.Y.Z, la adjunta a la release.
name: APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar
        run: ./gradlew --no-daemon assembleDebug
      - name: Renombrar
        run: |
          v="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || v="dev-${GITHUB_SHA::7}"
          cp app/build/outputs/apk/debug/app-debug.apk "X-USB-${v}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: X-USB-apk
          path: X-USB-*.apk
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: X-USB-*.apk
          generate_release_notes: true
